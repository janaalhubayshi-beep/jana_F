<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مشروعي الأول</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      padding: 2.5rem;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      transition: transform 0.2s, background 0.2s;
    }
    button:hover {
      background-color: #45a049;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>مرحباً بك في مستودع GitHub! 🚀</h1>
    <p>تم إنشاء ورفع هذا الملف بنجاح باستخدام VS Code و Git.</p>
    <button onclick="showMessage()">اضغط هنا</button>
    <p id="output" style="margin-top: 15px; font-weight: bold;"></p>
  </div>

  <script>
    function showMessage() {
      document.getElementById('output').textContent = 'رائع! كل الأوامر تعمل بنجاح ✨';
    }
  </script>
</body>
</html>
